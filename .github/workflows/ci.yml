name: Python checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,typesafe]"
      - name: CLI smoke test
        run: jev --help
      - name: Unit tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
