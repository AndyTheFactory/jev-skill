[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-decisions"
version = "0.1.0"
description = "A reusable Jev decision engine and Claude Code skill"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jev-skill contributors" }]
dependencies = [
  "pydantic>=2.6,<3",
  "pyyaml>=6,<7",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9",
  "mypy>=1.14",
  "build>=1",
  "setuptools>=68",
  "wheel>=0.43",
  "types-PyYAML>=6",
  "respx>=0.21",
]

[project.scripts]
jev = "jev_decisions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_decisions = ["profiles/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
